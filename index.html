<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifiq - Fact-Checking Avançado</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: Arial, sans-serif; padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { color: #58a6ff; margin: 0; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; width: 100%; max-width: 420px; box-sizing: border-box; text-align: center; }
        .btn { background-color: #238636; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-mic { background-color: #1f6feb; }
        .btn-check { background-color: #d29922; }
        .btn-sound { background-color: #21262d; border: 1px solid #30363d; color: #c9d1d9; margin-top: 10px; font-size: 13px; padding: 8px; }
        .status { margin-top: 10px; font-size: 14px; color: #8b949e; }
        .timer { font-size: 18px; font-weight: bold; color: #f0f6fc; margin: 10px 0; }
        .output { margin-top: 15px; padding: 12px; background: #21262d; border-radius: 8px; color: #58a6ff; min-height: 40px; word-break: break-word; text-align: left; }
        .select-box { margin-top: 15px; text-align: left; }
        .select-box label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 5px; }
        .select-box select { width: 100%; padding: 10px; background: #21262d; border: 1px solid #30363d; color: white; border-radius: 6px; font-size: 14px; }
        
        .badge-container { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .badge { padding: 10px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; text-align: center; flex: 1; display: none; transition: background-color 0.4s ease, color 0.4s ease; }
        .bg-verdadeiro { background-color: #238636; color: #ffffff; }
        .bg-falso { background-color: #da3633; color: #ffffff; }
        .bg-impreciso { background-color: #d29922; color: #ffffff; }

        .logs { margin-top: 20px; text-align: left; max-height: 250px; overflow-y: auto; }
        .log-item { background: #0d1117; border: 1px solid #30363d; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ Verifiq</h1>
        <p>Análise de Fatos com Alta Precisão</p>
    </div>

    <div class="card">
        <h3>Painel de Verificação</h3>
        
        <div class="select-box" style="margin-top:0;">
            <label for="mode">Modo de Captura:</label>
            <select id="mode">
                <option value="manual">Manual (Análise Contínua em Tempo Real)</option>
                <option value="auto">Automático (Para no Fim da Fala)</option>
            </select>
        </div>

        <button class="btn btn-mic" id="btnMic" onclick="toggleRecognition()">🎙️ Iniciar Escuta</button>
        <button class="btn btn-sound" id="btnSound" onclick="toggleSound()">🔊 Sons: Ativados</button>
        
        <div id="timer" class="timer">⏱️ 00:00</div>
        <div id="status" class="status">Aguardando comando...</div>
        <div id="output" class="output">O texto falado aparecerá aqui...</div>

        <div class="badge-container">
            <div id="badgeStatus" class="badge">Veredito</div>
            <div id="badgePct" class="badge">0% Certeza</div>
        </div>

        <div class="select-box">
            <label for="engine">Escolha onde analisar:</label>
            <select id="engine">
                <option value="ia">🤖 IA Generativa (Com Percentuais)</option>
                <option value="factcheck">📰 Google Fact Check (Agências)</option>
            </select>
        </div>

        <button class="btn btn-check" onclick="processCheck()">🔍 Analisar Fato Manualmente</button>

        <div id="logs" class="logs"></div>
    </div>

    <script>
        // === COLE SUA CHAVE DO GROQ ABAIXO ===
        const GROQ_API_KEY = "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";
        const GOOGLE_FACT_CHECK_KEY = "AIzaSyDztr03Zd3MGyaERYTjnq60LIxuAlRtrBA"; // Opcional

        let recognition;
        let isListening = false;
        let isManualAction = false;
        let soundEnabled = true;
        let timerInterval = null;
        let secondsElapsed = 0;
        let lastProcessedText = "";
        let analysisTimeout = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(type) {
            if (!soundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'start') {
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'stop') {
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(440, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'verdadeiro') {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2); gain2.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(523.25, now);
                    osc2.frequency.setValueAtTime(659.25, now);
                    gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    gain2.gain.setValueAtTime(0.12, now); gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now); osc2.start(now);
                    osc.stop(now + 0.35); osc2.stop(now + 0.35);
                } else if (type === 'falso') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(170, now + 0.3);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                }
            } catch(e){}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btnSound');
            btn.innerText = soundEnabled ? "🔊 Sons: Ativados" : "🔇 Sons: Desativados";
            btn.style.backgroundColor = soundEnabled ? "#21262d" : "#3d2121";
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('btnMic').innerText = '🔴 Parar Escuta';
                document.getElementById('status').innerText = 'Ouvindo... Fale algo!';
                if (isManualAction) {
                    startTimer();
                    playBeep('start');
                    isManualAction = false;
                }
            };

            recognition.onresult = (event) => {
                let currentTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentTranscript += event.results[i][0].transcript;
                }

                document.getElementById('output').innerText = currentTranscript;
                
                const mode = document.getElementById('mode').value;
                if (mode === 'auto') {
                    recognition.stop();
                } else if (mode === 'manual') {
                    // Aguarda 1.5s após a última palavra para garatinr uma frase completa e precisa
                    clearTimeout(analysisTimeout);
                    const cleanText = currentTranscript.trim();
                    if (cleanText.length > 8 && cleanText !== lastProcessedText) {
                        analysisTimeout = setTimeout(() => {
                            lastProcessedText = cleanText;
                            processCheckAuto(cleanText);
                        }, 1500);
                    }
                }
            };

            recognition.onend = () => {
                const mode = document.getElementById('mode').value;
                if (isListening && mode === 'manual' && !isManualAction) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    if (isManualAction) {
                        stopTimer();
                        playBeep('stop');
                        isManualAction = false;
                    }
                    isListening = false;
                    document.getElementById('btnMic').innerText = '🎙️ Iniciar Escuta';
                    document.getElementById('status').innerText = 'Escuta finalizada.';
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    document.getElementById('status').innerText = 'Erro no microfone: ' + event.error;
                }
            };
        }

        function toggleRecognition() {
            if (!recognition) {
                alert("Seu navegador não suporta reconhecimento de voz.");
                return;
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isManualAction = true;
            const mode = document.getElementById('mode').value;
            
            if (mode === 'auto') {
                recognition.continuous = false;
                recognition.interimResults = false;
            } else {
                recognition.continuous = true;
                recognition.interimResults = true;
            }

            if (isListening) {
                isListening = false;
                recognition.stop();
            } else {
                document.getElementById('output').innerText = "O texto falado aparecerá aqui...";
                lastProcessedText = "";
                try {
                    recognition.start();
                } catch(e) {
                    recognition.stop();
                }
            }
        }

        function startTimer() {
            secondsElapsed = 0;
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `⏱️ ${mins}:${secs}`;
        }

        async function processCheck() {
            const text = document.getElementById('output').innerText;
            if (!text || text === "O texto falado aparecerá aqui...") {
                alert("Fale algo no microfone primeiro!");
                return;
            }
            await processCheckAuto(text);
        }

        async function processCheckAuto(text) {
            const engine = document.getElementById('engine').value;
            if (engine === "factcheck") {
                await checkFactCheckAPI(text);
            } else {
                await checkGroqAI(text);
            }
        }

        function updateBadges(verdict, percentage) {
            const badgeStatus = document.getElementById('badgeStatus');
            const badgePct = document.getElementById('badgePct');

            badgeStatus.style.display = "block";
            badgePct.style.display = "block";

            const pctNum = Math.min(Math.max(parseInt(percentage) || 0, 0), 100);

            badgeStatus.className = "badge";
            if (verdict.includes("Verdadeiro") || verdict.includes("Verdadeira")) {
                badgeStatus.classList.add("bg-verdadeiro");
                badgeStatus.innerText = "✓ Verdadeiro";
                playBeep('verdadeiro');
            } else if (verdict.includes("Falso") || verdict.includes("Falsa")) {
                badgeStatus.classList.add("bg-falso");
                badgeStatus.innerText = "✗ Falso";
                playBeep('falso');
            } else {
                badgeStatus.classList.add("bg-impreciso");
                badgeStatus.innerText = "⚠ Impreciso";
            }

            const hue = Math.round((pctNum / 100) * 120); 
            badgePct.className = "badge";
            badgePct.style.backgroundColor = `hsl(${hue}, 80%, 35%)`;
            badgePct.style.color = "#ffffff";
            badgePct.innerText = `${pctNum}% Certeza`;
        }

        async function checkFactCheckAPI(text) {
            const logs = document.getElementById('logs');
            const url = `https://factchecktools.googleapis.com/v1alpha1/claims:search?query=${encodeURIComponent(text)}&languageCode=pt&key=${GOOGLE_FACT_CHECK_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.claims && data.claims.length > 0) {
                    const rating = data.claims[0].claimReview[0].textualRating;
                    updateBadges(rating, "80");
                    logs.innerHTML = `<div class='log-item'>📌 <strong>Agência:</strong> ${rating}<br>${text}</div>` + logs.innerHTML;
                } else {
                    logs.innerHTML = `<div class='log-item'>⚠️ Nenhuma checagem encontrada para: "${text}"</div>` + logs.innerHTML;
                }
            } catch (e) { }
        }

        async function checkGroqAI(text) {
            const logs = document.getElementById('logs');

            const prompt = `Você é um verificador de fatos (Fact-Checker) especialista e extremamente rigoroso.
            Analise a seguinte frase dita pelo usuário: "${text}".
            Avalie com cuidado se a afirmação é Factualmente Verdadeira, Falsa ou Imprecisa/Incompleta.
            
            Retorne EXATAMENTE e APENAS este objeto JSON puro, sem formatação markdown extra:
            {"veredicto": "Verdadeiro", "porcentagem": 95, "explicacao": "Breve justificativa factual em 1 frase."}
            
            Regras de veredicto:
            - Se for um fato comprovado historicamente ou cientificamente, use "Verdadeiro".
            - Se for mentira, boato ou erro histórico/científico, use "Falso".
            - Se depender de contexto, opinião subjetiva ou for parcialmente correto, use "Impreciso".`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${GROQ_API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.1
                    })
                });
                const data = await response.json();
                const content = data.choices[0].message.content;
                
                const parsed = JSON.parse(content.substring(content.indexOf('{'), content.lastIndexOf('}') + 1));
                
                updateBadges(parsed.veredicto, parsed.porcentagem);

                const logEntry = `
                    <div class='log-item'>
                        <strong>[${parsed.veredicto} - ${parsed.porcentagem}%]</strong> ${text}<br>
                        <small style="color:#8b949e;">${parsed.explicacao}</small>
                    </div>`;
                
                logs.innerHTML = logEntry + logs.innerHTML;
            } catch (e) { }
        }
    </script>
</body>
</html>
