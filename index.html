<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifiq - Checagem de Fatos</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; text-align: center; }
        .btn { background-color: #238636; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; }
        .btn-check { background-color: #d29922; }
        .verdict { margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛡️ Verifiq</h1>
        <div id="output" style="background:#21262d; padding:10px; border-radius:8px; min-height: 50px;">Aguardando...</div>
        <button class="btn" id="btnMic" onclick="toggleRecognition()">🎙️ Iniciar Escuta</button>
        <button class="btn btn-check" onclick="checkFact()">🔍 Verificar Fato</button>
        <div id="verdict" class="verdict"></div>
    </div>

    <script>
        let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'pt-BR';
        let isListening = false;

        recognition.onresult = (event) => {
            document.getElementById('output').innerText = event.results[0][0].transcript;
        };

        function toggleRecognition() {
            if(isListening) { recognition.stop(); isListening = false; document.getElementById('btnMic').innerText = '🎙️ Iniciar Escuta'; }
            else { recognition.start(); isListening = true; document.getElementById('btnMic').innerText = '🔴 Parar'; }
        }

        function checkFact() {
            const text = document.getElementById('output').innerText.toLowerCase();
            const verdictDiv = document.getElementById('verdict');
            verdictDiv.style.display = 'block';

            // Lógica de simulação (Mock)
            if (text.includes("falso") || text.includes("mentira")) {
                verdictDiv.style.backgroundColor = "#da3633";
                verdictDiv.innerText = "❌ Veredito: Provável Fake News";
            } else if (text.includes("verdade")) {
                verdictDiv.style.backgroundColor = "#238636";
                verdictDiv.innerText = "✅ Veredito: Provavelmente Verdadeiro";
            } else {
                verdictDiv.style.backgroundColor = "#58a6ff";
                verdictDiv.innerText = "⚠️ Necessita de mais investigação.";
            }
        }
    </script>
</body>
</html>
