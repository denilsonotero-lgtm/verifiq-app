<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifiq - Fact-Checking & IA</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: Arial, sans-serif; padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #58a6ff; margin: 0; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
        .btn { background-color: #238636; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-mic { background-color: #1f6feb; }
        .btn-check { background-color: #d29922; }
        .status { margin-top: 10px; font-size: 14px; color: #8b949e; }
        .output { margin-top: 15px; padding: 12px; background: #21262d; border-radius: 8px; color: #58a6ff; min-height: 40px; word-break: break-word; }
        .select-box { margin-top: 15px; text-align: left; }
        .select-box label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 5px; }
        .select-box select { width: 100%; padding: 10px; background: #21262d; border: 1px solid #30363d; color: white; border-radius: 6px; font-size: 14px; }
        .results { margin-top: 20px; text-align: left; }
        .fact-item { background: #0d1117; border: 1px solid #30363d; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; line-height: 1.4; }
        .rating { font-weight: bold; color: #f85149; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ Verifiq</h1>
    </div>

    <div class="card">
        <h3>Painel de Verificação</h3>
        
        <button class="btn btn-mic" id="btnMic" onclick="toggleRecognition()">🎙️ Iniciar Escuta</button>
        
        <div id="status" class="status">Aguardando comando...</div>
        <div id="output" class="output">O texto falado aparecerá aqui...</div>

        <div class="select-box">
            <label for="engine">Escolha onde analisar:</label>
            <select id="engine">
                <option value="ia">🤖 IA Generativa (Perguntas/Histórias)</option>
                <option value="factcheck">📰 Google Fact Check (Agências)</option>
            </select>
        </div>

        <button class="btn btn-check" onclick="processCheck()">🔍 Analisar Fato</button>

        <div id="results" class="results"></div>
    </div>

    <script>
        // === COLE SUAS CHAVES AQUI ===
        // Se não tiver uma, deixe vazio assim: ""
        const GOOGLE_FACT_CHECK_KEY = "AIzaSyDztr03Zd3MGyaERYTjnq60LIxuAlRtrBA"; 
        const GROQ_API_KEY = "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";

        let recognition;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.onresult = (event) => document.getElementById('output').innerText = event.results[0][0].transcript;
        }

        function toggleRecognition() {
            if (!recognition) return;
            const btn = document.getElementById('btnMic');
            if (isListening) { recognition.stop(); isListening = false; btn.innerText = '🎙️ Iniciar Escuta'; }
            else { recognition.start(); isListening = true; btn.innerText = '🔴 Parar Escuta'; }
        }

        async function processCheck() {
            const text = document.getElementById('output').innerText;
            const engine = document.getElementById('engine').value;

            if (text === "O texto falado aparecerá aqui...") { alert("Fale algo antes!"); return; }

            if (engine === "factcheck") {
                if(GOOGLE_FACT_CHECK_KEY.includes("COLE") || GOOGLE_FACT_CHECK_KEY === "") {
                    alert("Chave do Google não configurada!"); return;
                }
                await checkFactCheckAPI(text);
            } else {
                if(GROQ_API_KEY.includes("COLE") || GROQ_API_KEY === "") {
                    alert("Chave do Groq não configurada!"); return;
                }
                await checkGroqAI(text);
            }
        }

        async function checkFactCheckAPI(text) {
            document.getElementById('results').innerHTML = "Consultando...";
            const url = `https://factchecktools.googleapis.com/v1alpha1/claims:search?query=${encodeURIComponent(text)}&languageCode=pt&key=${GOOGLE_FACT_CHECK_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.claims && data.claims.length > 0) {
                    document.getElementById('results').innerHTML = data.claims.map(c => `<div class='fact-item'><strong>Alegação:</strong> ${c.text}<br>📌 Veredito: ${c.claimReview[0].textualRating}</div>`).join('');
                } else {
                    document.getElementById('results').innerHTML = "Nenhuma checagem encontrada.";
                }
            } catch (e) { document.getElementById('results').innerHTML = "Erro na consulta."; }
        }

        async function checkGroqAI(text) {
            document.getElementById('results').innerHTML = "Analisando...";
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${GROQ_API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [{ role: 'user', content: `Analise: "${text}". Diga se é Verdadeiro, Falso ou Fato Histórico.` }]
                    })
                });
                const data = await response.json();
                document.getElementById('results').innerHTML = `<div class='fact-item'>${data.choices[0].message.content}</div>`;
            } catch (e) { document.getElementById('results').innerHTML = "Erro na consulta."; }
        }
    </script>
</body>
</html>
