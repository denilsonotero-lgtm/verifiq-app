<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifiq - Fact-Checking & IA Avançado</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: Arial, sans-serif; padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #58a6ff; margin: 0; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
        .btn { background-color: #238636; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-mic { background-color: #1f6feb; }
        .btn-check { background-color: #d29922; }
        .status { margin-top: 10px; font-size: 14px; color: #8b949e; }
        .timer { font-size: 18px; font-weight: bold; color: #f0f6fc; margin: 10px 0; }
        .output { margin-top: 15px; padding: 12px; background: #21262d; border-radius: 8px; color: #58a6ff; min-height: 40px; word-break: break-word; text-align: left; }
        .select-box { margin-top: 15px; text-align: left; }
        .select-box label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 5px; }
        .select-box select { width: 100%; padding: 10px; background: #21262d; border: 1px solid #30363d; color: white; border-radius: 6px; font-size: 14px; }
        .results { margin-top: 20px; text-align: left; }
        .fact-item { background: #0d1117; border: 1px solid #30363d; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ Verifiq</h1>
        <p>Análise Inteligente e Percentual de Fatos</p>
    </div>

    <div class="card">
        <h3>Painel de Verificação</h3>
        
        <div class="select-box" style="margin-top:0;">
            <label for="mode">Modo de Captura:</label>
            <select id="mode">
                <option value="manual">Manual (Botão Liga/Desliga)</option>
                <option value="auto">Automático (Detecta Fim da Fala)</option>
            </select>
        </div>

        <button class="btn btn-mic" id="btnMic" onclick="toggleRecognition()">🎙️ Iniciar Escuta</button>
        
        <div id="timer" class="timer">⏱️ 00:00</div>
        <div id="status" class="status">Aguardando comando...</div>
        <div id="output" class="output">O texto falado aparecerá aqui...</div>

        <div class="select-box">
            <label for="engine">Escolha onde analisar:</label>
            <select id="engine">
                <option value="ia">🤖 IA Generativa (Com Percentuais)</option>
                <option value="factcheck">📰 Google Fact Check (Agências)</option>
            </select>
        </div>

        <button class="btn btn-check" onclick="processCheck()">🔍 Analisar Fato</button>

        <div id="results" class="results"></div>
    </div>

    <script>
        // === COLE SUA CHAVE DO GROQ ABAIXO ===
        const GROQ_API_KEY = " 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";
        const GOOGLE_FACT_CHECK_KEY = "AIzaSyDztr03Zd3MGyaERYTjnq60LIxuAlRtrBA"; // Opcional

        let recognition;
        let isListening = false;
        let timerInterval;
        let secondsElapsed = 0;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';

            // Configuração do modo automático ou contínuo
            recognition.onstart = () => {
                isListening = true;
                startTimer();
                document.getElementById('btnMic').innerText = '🔴 Parar Escuta';
                document.getElementById('status').innerText = 'Ouvindo... Fale algo!';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('output').innerText = transcript;
                
                // Se estiver no modo automático, para sozinho ao capturar a fala
                const mode = document.getElementById('mode').value;
                if (mode === 'auto') {
                    recognition.stop();
                }
            };

            recognition.onend = () => {
                isListening = false;
                stopTimer();
                document.getElementById('btnMic').innerText = '🎙️ Iniciar Escuta';
                if(document.getElementById('status').innerText === 'Ouvindo... Fale algo!') {
                    document.getElementById('status').innerText = 'Escuta finalizada.';
                }
            };

            recognition.onerror = (event) => {
                document.getElementById('status').innerText = 'Erro no microfone: ' + event.error;
                stopTimer();
                isListening = false;
                document.getElementById('btnMic').innerText = '🎙️ Iniciar Escuta';
            };
        }

        function toggleRecognition() {
            if (!recognition) {
                alert("Seu navegador não suporta reconhecimento de voz.");
                return;
            }

            const mode = document.getElementById('mode').value;
            
            // Define se continua ouvindo ou encerra sozinho na pausa
            if (mode === 'auto') {
                recognition.continuous = false;
                recognition.interimResults = false;
            } else {
                recognition.continuous = true;
                recognition.interimResults = true;
            }

            if (isListening) {
                recognition.stop();
            } else {
                document.getElementById('output').innerText = "O texto falado aparecerá aqui...";
                document.getElementById('results').innerHTML = "";
                try {
                    recognition.start();
                } catch(e) {
                    recognition.stop();
                }
            }
        }

        function startTimer() {
            secondsElapsed = 0;
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `⏱️ ${mins}:${secs}`;
        }

        async function processCheck() {
            const text = document.getElementById('output').innerText;
            const engine = document.getElementById('engine').value;

            if (!text || text === "O texto falado aparecerá aqui...") {
                alert("Fale algo no microfone primeiro!");
                return;
            }

            if (engine === "factcheck") {
                await checkFactCheckAPI(text);
            } else {
                await checkGroqAI(text);
            }
        }

        async function checkFactCheckAPI(text) {
            document.getElementById('results').innerHTML = "Consultando agências...";
            const url = `https://factchecktools.googleapis.com/v1alpha1/claims:search?query=${encodeURIComponent(text)}&languageCode=pt&key=${GOOGLE_FACT_CHECK_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.claims && data.claims.length > 0) {
                    document.getElementById('results').innerHTML = data.claims.map(c => `<div class='fact-item'><strong>Alegação:</strong> ${c.text}<br>📌 Veredito: ${c.claimReview[0].textualRating}</div>`).join('');
                } else {
                    document.getElementById('results').innerHTML = "<div class='fact-item'>⚠️ Nenhuma checagem jornalística encontrada. Tente usar a IA Generativa.</div>";
                }
            } catch (e) { document.getElementById('results').innerHTML = "Erro na consulta."; }
        }

        async function checkGroqAI(text) {
            document.getElementById('results').innerHTML = "Analisando com IA e calculando percentuais...";
            
            const prompt = `Analise a seguinte afirmação captada por áudio: "${text}". 
            Classifique obrigatoriamente a afirmação em uma destas categorias: Verdadeira, Falsa ou Imprecisa.
            Atribua também um percentual de certeza para a classificação (ex: 95% Verdadeira, 80% Falsa, etc.).
            Estruture a resposta exatamente neste formato:
            - **Classificação:** [Verdadeira / Falsa / Imprecisa]
            - **Percentual:** [X]% de [Verdade / Falsidade / Imprecisão]
            - **Explicação:** [Breve explicação em até 2 frases]`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${GROQ_API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [{ role: 'user', content: prompt }]
                    })
                });
                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                document.getElementById('results').innerHTML = `<div class='fact-item'>${aiResponse.replace(/\n/g, '<br>')}</div>`;
            } catch (e) { 
                document.getElementById('results').innerHTML = "<div class='fact-item'>Erro na consulta da IA. Verifique sua chave do Groq.</div>"; 
            }
        }
    </script>
</body>
</html>
