<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifiq - Checagem de Fatos</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #58a6ff; margin: 0; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-mic { background-color: #1f6feb; }
        .status { margin-top: 15px; font-size: 14px; color: #8b949e; }
        .transcription {
            margin-top: 15px;
            padding: 10px;
            background: #21262d;
            border-radius: 8px;
            font-style: italic;
            color: #58a6ff;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ Verifiq</h1>
        <p>Fact-Checking em Tempo Real</p>
    </div>

    <div class="card">
        <h3>Painel de Verificação</h3>
        <button class="btn btn-mic" id="btnMic" onclick="toggleRecognition()">🎙️ Iniciar Escuta</button>
        
        <div id="status" class="status">Aguardando comando...</div>
        <div id="output" class="transcription">O texto falado aparecerá aqui...</div>
    </div>

    <script>
        let recognition;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'pt-BR';

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('output').innerText = transcript;
            };

            recognition.onerror = (event) => {
                document.getElementById('status').innerText = 'Erro no microfone: ' + event.error;
            };
        } else {
            document.getElementById('status').innerText = 'Reconhecimento de voz não suportado neste navegador.';
        }

        function toggleRecognition() {
            if (!recognition) return;

            const btn = document.getElementById('btnMic');
            const status = document.getElementById('status');

            if (isListening) {
                recognition.stop();
                isListening = false;
                btn.innerText = '🎙️ Iniciar Escuta';
                status.innerText = 'Escuta parada.';
            } else {
                recognition.start();
                isListening = true;
                btn.innerText = '🔴 Parar Escuta';
                status.innerText = 'Ouvindo... Fale algo para verificar!';
            }
        }
    </script>
</body>
</html>
